<div class="card overflow-x-auto">
    <div class="flex justify-content-between align-items-center mb-4">
        <div class="flex gap-3 align-items-center">
            <div class="text-4xl">📊</div>
            <div class="flex flex-col gap-1 text-600">
                <div class="text-xl font-semibold">SALDOS DE CUENTA POR COBRAR</div>
                <div class="font-bold text-primary">Gestion de Saldos</div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <fieldset class="border border-gray-300 rounded-lg p-5">
            <legend class="px-3 py-1 text-primary font-semibold text-base bg-gray-50 rounded-md border border-gray-200">
              Búsqueda Personalizada
            </legend>
            <div class="grid grid-cols-12 gap-4 ">
                <div  class="col-span-12 md:col-span-2" >
                    <p-floatlabel variant="on"> 
                        <p-select [options]="_ciclo" optionLabel="descripcion" optionValue="idCiclo"  (onChange)="changeCiclo($event.value)" 
                            filterBy="descripcion" [filter]="true" [(ngModel)]="_facMensualModel.idCiclo"    class="w-full" appendTo="body"   ></p-select> 
                        <label>Ciclo</label>
                    </p-floatlabel>
                </div>
                <div class="col-span-12 md:col-span-2 ">
                    <p-floatlabel variant="on">
                        <p-select [options]="_localidad" optionLabel="descripcion"  optionValue="idSucursal" filterBy="descripcion" [filter]="true"
                                    class="w-full" appendTo="body"  [(ngModel)]="_facMensualModel.idSucursal"  ></p-select> 
                        <label>Localidad</label>
                    </p-floatlabel>
                </div>
                <div class="col-span-12 md:col-span-2 ">
                    <p-floatlabel variant="on">
                        <p-select [options]="_anioXciclo" optionLabel="anio"  optionValue="anio" filterBy="descripcion" [filter]="true"
                                (onChange)="changeAnio($event.value)"   class="w-full" appendTo="body" [(ngModel)]="_facMensualModel.anio" ></p-select> 
                        <label>Año</label>
                    </p-floatlabel>
                </div>
                <div class="col-span-12 md:col-span-2 ">
                    <p-floatlabel variant="on">
                        <p-select [options]="_mesXciclo" optionLabel="nombreMes"  optionValue="mes" filterBy="nombreMes" [filter]="true"
                                    class="w-full" appendTo="body" [(ngModel)]="_facMensualModel.mes" ></p-select> 
                        <label>Mes</label>
                    </p-floatlabel>
                </div>
                <div class="col-span-12 md:col-span-2">
                    <button pButton pRipple icon="pi pi-search"  severity="info" (click)="searchResumen()" label="Buscar" iconPos="right" class="p-button p-button-warning  mr-2" ></button>
                </div>
            </div> 
        </fieldset>
        <br>
        <p-tabs value="0">
            <p-tablist>
                <p-tab value="0" ><i class="pi pi-spin pi-spinner-dotted" style="font-size: 1rem;color: green"></i>Resumen</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="0" >
                    <div class="card" *ngIf="blockFiltro ==1">
                        <p-table #dt [value]="_listaResumen"  [rows]="20" [globalFilterFields]="['from', 'title', 'propietario','nrosuministro']" scrollable="true" scrollHeight="600px"
                             [rowHover]="true"dataKey="id"  resizableColumns="true" size="small"
                            >
                            <ng-template pTemplate="header">
                                <tr>
                                    <th class="text-center" >Tipo Saldo</th>
                                    <th class="text-center" >Tipo Estado Saldo</th>
                                    <th class="text-center" >Descripcion</th>
                                    <th class="text-center" >Importe</th>
                                    <th class="text-center" >Impresion</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-resumen>
                                <tr >
                                    <td  class="text-center">
                                        {{resumen.tipoSaldo}}
                                    </td>
                                    <td  class="text-center">
                                        {{resumen.idTipoEstadoSaldo}}
                                    </td>
                                    <td  class="text-center">
                                        {{resumen.descripcion}}
                                    </td>
                                    <td style="text-align: right;">  
                                        {{resumen.importe | number:'1.2-2' }}
                                    </td>
                                    <td style="text-align: right;">  
                                        <button pButton pRipple icon="pi pi-file-edit" class="p-button-success h-8 w-8 mr-2" (click)="viewReporte(resumen.tipoReporte)" tooltipPosition="top" type="button"></button>
                                    </td>
                                    
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="footer">
                                <tr>
                                    <td [colSpan]="3" style="text-align: right;" class="font-bold p-3 pb-0">TOTAL</td>
                                    <td style="text-align: right;" class="font-bold p-3 pb-0">{{ totales.importe | number:'1.2-2' }}</td>
                                    <td></td>
                                  </tr>
                            </ng-template>
                        </p-table>
                        <!--<br>
                        <button pButton pRipple icon="pi pi-print" class="p-button-succes  mr-2"   pTooltip="Imprimir " (click)="viewTarifas()"  tooltipPosition="top" type="button" label="Resumen Tarifa"></button>
                        <button pButton pRipple icon="pi pi-print" class="p-button-info  mr-2"   pTooltip="Imprimir " (click)="viewConcepto()"  tooltipPosition="top" type="button" label="Resumen Concepto"></button>
                        <button pButton pRipple icon="pi pi-print" class="p-button-warn  mr-2"   pTooltip="Imprimir " (click)="viewFactu()"  tooltipPosition="top" type="button" label="Resumen Tipo Facturación"></button>
                        <button pButton pRipple icon="pi pi-print" class="p-button-primary  mr-2"  pTooltip="Imprimir " (click)="viewMedicion()"  tooltipPosition="top" type="button" label="Resumen Medicion"></button>-->
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </div>

</div>

<p-dialog  [(visible)]="displayPDF" modal="modal" showEffect="fade" [style]="{height:'1600px',width:'1550px'}">
    <iframe width="100%" height="100%"   [src]="urlView |safe:'resourceUrl'"></iframe>
</p-dialog>
